; Development / CI environment for the WebSerialConsole library itself.
;
; Consumers do not need this file: they depend on the library through
; lib_deps in their own project.
;
;   pio test -e native                            # host-side tests, no hardware
;   pio test -e esp32c3 --without-uploading       # compile the on-device tests
;
; A library has no main(), so "pio run" cannot link a firmware here. The
; library is compiled as part of the project that consumes it.

[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	links2004/WebSockets @ ^2.4.1
test_framework = unity
; The library's own sources must be linked into the test firmware.
test_build_src = yes

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
	links2004/WebSockets @ ^2.4.1
test_framework = unity
test_build_src = yes

[env:esp32c3_nomdns]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DWEBSERIAL_DISABLE_MDNS
lib_deps =
	links2004/WebSockets @ ^2.4.1
test_framework = unity
test_build_src = yes

; Host-side tests: the console runs against the small Arduino stubs in
; test/stubs, so the source registry, the wire format and the JSON the
; browser consumes are checked without any hardware.
[env:native]
platform = native
test_framework = unity
build_flags = -I test/stubs
lib_ignore = WebSockets
lib_compat_mode = off
test_build_src = yes
; The on-device test suite needs a real ESP32.
test_ignore = test_console

